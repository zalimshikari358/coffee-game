<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Idle Miner Tycoon Clone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #1a1a2e; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #game-header { background: #0f3460; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #e94560; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; }
        .stat-box { background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 16px; border: 1px solid #e94560; display: flex; align-items: center; gap: 8px; }
        
        #view-toggle { background: #e94560; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #view-toggle:active { transform: scale(0.95); }

        #main-viewport { flex: 1; position: relative; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Map Screen Overlay */
        #map-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }
        .map-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; width: 100%; max-width: 400px; }
        .island-card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .island-card:hover { transform: translateY(-5px); background: #334155; }
        .island-card.locked { opacity: 0.5; border-color: #64748b; cursor: not-allowed; }

        /* Control Panel at Bottom */
        #controls-panel { background: #0f3460; padding: 12px; display: flex; gap: 10px; overflow-x: auto; z-index: 10; border-top: 2px solid #e94560; }
        .btn-upgrade { background: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; flex: 1; min-width: 110px; text-align: center; font-size: 13px; }
        .btn-upgrade:disabled { background: #4b5563; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="game-header">
        <div class="stat-box">💰 Cash: <span id="cash-txt">100</span></div>
        <button id="view-toggle" onclick="toggleView()">🗺️ World Map</button>
    </div>

    <div id="main-viewport">
        <canvas id="gameCanvas"></canvas>

        <div id="map-overlay">
            <h2 style="margin-bottom:20px; color:#38bdf8;">Select Mine Location</h2>
            <div class="map-grid">
                <div class="island-card" onclick="selectIsland('Grassland')">
                    <h3>🌱 Starter Island</h3>
                    <p style="color:#4ade80;">Active</p>
                </div>
                <div class="island-card locked">
                    <h3>❄️ Ice Island</h3>
                    <p style="color:#94a3b8;">Unlocks at $50k</p>
                </div>
                <div class="island-card locked">
                    <h3>🔥 Volcanic Island</h3>
                    <p style="color:#94a3b8;">Unlocks at $1M</p>
                </div>
                <div class="island-card locked">
                    <h3>💎 Crystal Island</h3>
                    <p style="color:#94a3b8;">Unlocks at $50M</p>
                </div>
            </div>
        </div>
    </div>

    <div id="controls-panel">
        <button class="btn-upgrade" id="up-shaft" onclick="upgradeShaft()">⛏️ Shaft Lvl <span id="shaft-lvl">1</span><br><small>$<span id="shaft-cost">50</span></small></button>
        <button class="btn-upgrade" id="up-ele" onclick="upgradeElevator()">🛗 Elevator Lvl <span id="ele-lvl">1</span><br><small>$<span id="ele-cost">100</span></small></button>
        <button class="btn-upgrade" id="up-ware" onclick="upgradeWarehouse()">🚚 Warehouse Lvl <span id="ware-lvl">1</span><br><small>$<span id="ware-cost">150</span></small></button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game State
    let cash = 100;
    let shaftLvl = 1;
    let eleLvl = 1;
    let wareLvl = 1;
    let currentView = 'mine';

    // Game Objects
    let miner = { x: 100, dir: 1, progress: 0 };
    let elevator = { y: 100, dir: 1, cargo: 0 };
    let warehouseWorker = { x: 60, dir: 1, cargo: 0 };
    let shaftStorage = 0;
    let topStorage = 0;

    function toggleView() {
        const map = document.getElementById('map-overlay');
        const btn = document.getElementById('view-toggle');
        if (currentView === 'mine') {
            currentView = 'map';
            map.style.display = 'flex';
            btn.innerText = '⛏️ Back to Mine';
        } else {
            currentView = 'mine';
            map.style.display = 'none';
            btn.innerText = '🗺️ World Map';
        }
    }

    function selectIsland(name) {
        alert("Switched to " + name);
        toggleView();
    }

    function upgradeShaft() {
        let cost = Math.floor(50 * Math.pow(1.5, shaftLvl - 1));
        if (cash >= cost) {
            cash -= cost;
            shaftLvl++;
            updateUI();
        }
    }

    function upgradeElevator() {
        let cost = Math.floor(100 * Math.pow(1.5, eleLvl - 1));
        if (cash >= cost) {
            cash -= cost;
            eleLvl++;
            updateUI();
        }
    }

    function upgradeWarehouse() {
        let cost = Math.floor(150 * Math.pow(1.5, wareLvl - 1));
        if (cash >= cost) {
            cash -= cost;
            wareLvl++;
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('cash-txt').innerText = Math.floor(cash);
        document.getElementById('shaft-lvl').innerText = shaftLvl;
        document.getElementById('shaft-cost').innerText = Math.floor(50 * Math.pow(1.5, shaftLvl - 1));
        document.getElementById('ele-lvl').innerText = eleLvl;
        document.getElementById('ele-cost').innerText = Math.floor(100 * Math.pow(1.5, eleLvl - 1));
        document.getElementById('ware-lvl').innerText = wareLvl;
        document.getElementById('ware-cost').innerText = Math.floor(150 * Math.pow(1.5, wareLvl - 1));
    }

    // Animation & Physics Loop
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (currentView === 'mine') {
            // Background Sky & Earth
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, 0, canvas.width, 120); // Sky
            
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, 110, canvas.width, 15); // Grass
            
            ctx.fillStyle = '#451a03';
            ctx.fillRect(0, 125, canvas.width, canvas.height - 125); // Underground Dirt

            // Elevator Shaft Frame
            ctx.fillStyle = '#27272a';
            ctx.fillRect(30, 50, 25, canvas.height - 100);

            // Shaft Tunnel 1
            ctx.fillStyle = '#261005';
            ctx.fillRect(55, 220, canvas.width - 55, 50);

            // --- MINER LOGIC ---
            miner.x += miner.dir * (1 + shaftLvl * 0.2);
            if (miner.x > canvas.width - 60) {
                miner.dir = -1;
                shaftStorage += shaftLvl * 10;
            }
            if (miner.x < 65) {
                miner.dir = 1;
            }

            // Draw Miner Character (Helmet + Body)
            ctx.fillStyle = '#f59e0b'; // Yellow Helmet
            ctx.beginPath(); ctx.arc(miner.x, 235, 8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#3b82f6'; // Blue Shirt
            ctx.fillRect(miner.x - 5, 243, 10, 12);

            // --- ELEVATOR LOGIC ---
            elevator.y += elevator.dir * (1 + eleLvl * 0.3);
            if (elevator.y > 230) {
                elevator.dir = -1;
                let take = Math.min(shaftStorage, eleLvl * 20);
                shaftStorage -= take;
                elevator.cargo += take;
            }
            if (elevator.y < 80) {
                elevator.dir = 1;
                topStorage += elevator.cargo;
                elevator.cargo = 0;
            }

            // Draw Elevator Basket
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(25, elevator.y, 35, 25);
            if (elevator.cargo > 0) {
                ctx.fillStyle = '#fbbf24'; // Gold inside
                ctx.beginPath(); ctx.arc(42, elevator.y + 12, 5, 0, Math.PI * 2); ctx.fill();
            }

            // --- WAREHOUSE WORKER LOGIC ---
            warehouseWorker.x += warehouseWorker.dir * (1 + wareLvl * 0.3);
            if (warehouseWorker.x > 200) {
                warehouseWorker.dir = -1;
                if (warehouseWorker.cargo > 0) {
                    cash += warehouseWorker.cargo;
                    warehouseWorker.cargo = 0;
                    updateUI();
                }
            }
            if (warehouseWorker.x < 65) {
                warehouseWorker.dir = 1;
                let take = Math.min(topStorage, wareLvl * 25);
                topStorage -= take;
                warehouseWorker.cargo += take;
            }

            // Draw Warehouse Worker
            ctx.fillStyle = '#10b981';
            ctx.fillRect(warehouseWorker.x - 5, 95, 10, 15);

            // Shaft Gold Display
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('📦 ' + Math.floor(shaftStorage), 70, 210);
            ctx.fillText('💰 Top: ' + Math.floor(topStorage), 70, 75);
        }

        requestAnimationFrame(gameLoop);
    }

    updateUI();
    gameLoop();
</script>
</body>
</html>
