<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pakistan Restaurant Tycoon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #2c3e50; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  
  /* Top HUD */
  #top-hud { background: #34495e; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #f1c40f; z-index: 10; }
  .hud-item { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 13px; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 15px; }
  .star-badge { background: #f1c40f; color: #000; padding: 2px 6px; border-radius: 8px; font-size: 11px; }

  /* Main Game Area */
  #game-container { flex: 1; position: relative; background: #e67e22; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }

  /* Bottom Control Panel */
  #bottom-hud { background: #34495e; padding: 10px; display: flex; justify-content: space-around; align-items: center; border-top: 3px solid #2c3e50; z-index: 10; }
  .btn-action { background: #8e44ad; color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .btn-boost { background: #f39c12; }

  /* Upgrade Popup Menu (Like Video) */
  #upgrade-menu { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 380px; background: white; color: #333; border-radius: 16px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; z-index: 20; border: 3px solid #3498db; }
  .menu-title { font-weight: bold; font-size: 16px; color: #2c3e50; margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 5px; display: flex; justify-content: space-between; }
  .upgrade-row { background: #f9f9f9; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
  .btn-upgrade-item { background: #2ecc71; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
  
  /* Floating Cash */
  .floating-cash { position: absolute; color: #2ecc71; font-weight: bold; font-size: 16px; pointer-events: none; animation: floatUp 1s ease-out forwards; text-shadow: 1px 1px 2px #000; }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-35px); } }
</style>
</head>
<body>

  <!-- Top HUD (Like Video) -->
  <div id="top-hud">
    <div class="hud-item"><span class="star-badge">⭐ 148</span> <span id="lvl-txt">lvl 25</span></div>
    <div class="hud-item">☕ <span id="coffee-count">734</span></div>
    <div class="hud-item">💵 $<span id="cash-balance">16.2M</span></div>
  </div>

  <!-- Game Floor Canvas Area -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Upgrade Popup Panel -->
    <div id="upgrade-menu">
      <div class="menu-title">
        <span>Level 25 - Coffee Shop Upgrades</span>
        <button onclick="closeMenu()" style="background:none;border:none;font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div class="upgrade-row">
        <div><b>Tray Size</b><br><small>More items in tray</small></div>
        <button class="btn-upgrade-item" onclick="upgradeItem()">878K</button>
      </div>
      <div class="upgrade-row">
        <div><b>Coffee Speed</b><br><small>Faster brewing</small></div>
        <button class="btn-upgrade-item" onclick="upgradeItem()">1.9M</button>
      </div>
    </div>
  </div>

  <!-- Bottom HUD Panel -->
  <div id="bottom-hud">
    <button class="btn-action" onclick="alert('Map & Locations')">📍 Map</button>
    <button class="btn-action btn-boost" onclick="alert('Income x2.3 Boost Active!')">⚡ x2.3 Income</button>
    <button class="btn-action" onclick="openMenu()">🛠️ Upgrades</button>
  </div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let cash = 16200000;
  let scoreCoffee = 734;

  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function drawGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Wooden Floor Background
    ctx.fillStyle = "#d35400";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Dining Tables (Top Area)
    ctx.fillStyle = "#34495e";
    for(let i=0; i<3; i++) {
      ctx.fillRect(40 + (i * 110), 50, 80, 50);
      ctx.fillStyle = "#fff";
      ctx.font = "10px sans-serif";
      ctx.fillText("🍽️ Table", 55 + (i * 110), 78);
      ctx.fillStyle = "#34495e";
    }

    // Counter Bar (Middle Area)
    ctx.fillStyle = "#1abc9c";
    ctx.fillRect(30, 200, canvas.width - 60, 70);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("🟢 Coffee & Burger Counter", 50, 240);

    // Locked Slots (Bottom Area - Like Video)
    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(50, 320, 100, 60);
    ctx.fillStyle = "#fff";
    ctx.fillText("🔒 2000$", 70, 355);

    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(170, 320, 100, 60);
    ctx.fillStyle = "#fff";
    ctx.fillText("🔒 5000$", 190, 355);

    requestAnimationFrame(drawGame);
  }

  function openMenu() {
    document.getElementById('upgrade-menu').style.display = 'block';
  }

  function closeMenu() {
    document.getElementById('upgrade-menu').style.display = 'none';
  }

  function upgradeItem() {
    cash += 500000;
    scoreCoffee += 12;
    document.getElementById('cash-balance').innerText = (cash / 1000000).toFixed(1) + 'M';
    document.getElementById('coffee-count').innerText = scoreCoffee;
    alert("Upgrade Successful! Profit Increased.");
    closeMenu();
  }

  canvas.addEventListener('click', function(e) {
    openMenu();
  });

  drawGame();
</script>
</body>
</html>
