<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Miner Tycoon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        h1 { color: #38bdf8; margin-bottom: 10px; font-size: 22px; }
        
        .stats-card { background: #1e293b; border: 2px solid #3b82f6; border-radius: 12px; padding: 15px; width: 100%; max-width: 400px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .stats-card h2 { font-size: 26px; color: #fbbf24; margin-top: 5px; }

        .upgrades-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
        
        .upgrade-btn { background: #10b981; color: white; border: none; padding: 12px 15px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
        .upgrade-btn:active { transform: scale(0.97); }
        .upgrade-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }
        
        .info-text { font-size: 12px; color: #cbd5e1; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <h1>⛏️ Idle Miner Tycoon</h1>

    <div class="stats-card">
        <p>Total Cash</p>
        <h2 id="cash-display">💰 0</h2>
        <p style="font-size: 13px; color: #34d399; margin-top: 8px;" id="income-display">Income: +1 $/sec</p>
    </div>

    <div class="upgrades-container">
        <button class="upgrade-btn" onclick="buyUpgrade('miner')">
            <span>👷 Hire Miner (Lvl <span id="miner-lvl">1</span>)</span>
            <span id="miner-cost">💰 50</span>
        </button>

        <button class="upgrade-btn" onclick="buyUpgrade('elevator')">
            <span>🛗 Upgrade Elevator (Lvl <span id="ele-lvl">1</span>)</span>
            <span id="ele-cost">💰 100</span>
        </button>

        <button class="upgrade-btn" onclick="buyUpgrade('warehouse')">
            <span>🚚 Upgrade Warehouse (Lvl <span id="ware-lvl">1</span>)</span>
            <span id="ware-cost">💰 200</span>
        </button>
    </div>

    <p class="info-text">Automatic earnings will increase as you upgrade your mine components!</p>

<script>
    let game = {
        cash: 10,
        minerLvl: 1,
        minerCost: 50,
        eleLvl: 1,
        eleCost: 100,
        wareLvl: 1,
        wareCost: 200
    };

    function getIncome() {
        return game.minerLvl * game.eleLvl * game.wareLvl;
    }

    function updateUI() {
        document.getElementById('cash-display').innerText = '💰 ' + Math.floor(game.cash);
        document.getElementById('income-display').innerText = 'Income: +' + getIncome() + ' $/sec';
        
        document.getElementById('miner-lvl').innerText = game.minerLvl;
        document.getElementById('miner-cost').innerText = '💰 ' + game.minerCost;
        
        document.getElementById('ele-lvl').innerText = game.eleLvl;
        document.getElementById('ele-cost').innerText = '💰 ' + game.eleCost;
        
        document.getElementById('ware-lvl').innerText = game.wareLvl;
        document.getElementById('ware-cost').innerText = '💰 ' + game.wareCost;
    }

    function buyUpgrade(type) {
        if (type === 'miner' && game.cash >= game.minerCost) {
            game.cash -= game.minerCost;
            game.minerLvl++;
            game.minerCost = Math.floor(game.minerCost * 1.5);
        } else if (type === 'elevator' && game.cash >= game.eleCost) {
            game.cash -= game.eleCost;
            game.eleLvl++;
            game.eleCost = Math.floor(game.eleCost * 1.5);
        } else if (type === 'warehouse' && game.cash >= game.wareCost) {
            game.cash -= game.wareCost;
            game.wareLvl++;
            game.wareCost = Math.floor(game.wareCost * 1.5);
        }
        updateUI();
    }

    // Game loop (Earns cash every second)
    setInterval(function() {
        game.cash += getIncome();
        updateUI();
    }, 1000);

    updateUI();
</script>

</body>
</html>
